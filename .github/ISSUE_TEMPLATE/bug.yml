name: Bug report
description: Report reproducible behaviour in Squad.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private project names, full settings or raw transcripts. Use SECURITY.md for sensitive reports.
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      options: [Codex, Claude Code, Both, CLI or packaging]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Squad version, harness version and operating system
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted diagnostics and reproduction configuration
