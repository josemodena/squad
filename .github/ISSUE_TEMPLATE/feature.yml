name: Feature request
description: Propose an improvement to coordination, usability or portability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should Squad solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour and alternatives
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Harnesses affected and how success could be tested
