name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: plugins/codex/squad/conductor-appserver/go.mod
          cache-dependency-path: plugins/codex/squad/conductor-appserver/go.sum
      - name: Install fixture dependencies
        run: sudo apt-get update && sudo apt-get install -y jq gh curl
      - name: Download Go modules for isolated installer fixtures
        working-directory: plugins/codex/squad/conductor-appserver
        run: go mod download
      - name: Validate both distributions
        run: bash tools/test.sh
